name: flutter_pro_app
description: Professional Flutter Mobile App with Authentication, Database, API & UI Components
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

  # Authentication
  firebase_auth: ^4.17.0
  google_sign_in: ^6.2.0

  # Security & Storage
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # UI & Design
  flutter_screenutil: ^5.9.0
  gap: ^3.0.1
  lottie: ^2.7.0
  cached_network_image: ^3.3.0

  # Serialization
  json_serializable: ^6.7.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utils
  intl: ^0.19.0
  logger: ^2.1.0
  get_it: ^7.6.0
  equatable: ^2.0.5

  # Validation
  form_validator: ^1.1.0

  # Notifications
  firebase_messaging: ^14.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  freezed: ^2.4.1
  retrofit_generator: ^8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
